<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Placar Body Evolution</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cg fill='%23ff1f3d'%3E%3Ccircle cx='38' cy='15' r='5.5'/%3E%3Cpath d='M30 24c2-2 5-3 8-2l7 3c1.5.7 2 2.5 1 4-.8 1.3-2.5 1.7-4 1l-4-1.7-3 6 6 5c1 .9 1.4 2 1 3.3l-3 11c-.5 1.8-2.3 2.7-4 2.2-1.7-.5-2.6-2.3-2.1-4l2.4-9-7-5.7c-1.6-1.3-2-3.5-1-5.3z'/%3E%3Cpath d='M27 34l-9 2c-1.6.4-3.2-.6-3.6-2.2-.4-1.6.6-3.2 2.2-3.6l8-2z'/%3E%3Cpath d='M30 47l-7 8c-1.1 1.3-3 1.4-4.2.3-1.3-1.1-1.4-3-.3-4.2l7-8z'/%3E%3C/g%3E%3Cg stroke='%23ff1f3d' stroke-width='2.5' stroke-linecap='round' opacity='.5'%3E%3Cline x1='8' y1='20' x2='20' y2='20'/%3E%3Cline x1='6' y1='28' x2='15' y2='28'/%3E%3Cline x1='9' y1='36' x2='18' y2='36'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--red:#c8102e;--red-glow:#ff1f3d;--black:#0a0a0a;--panel:#141414;--panel-2:#1c1c1c;--line:#2a2a2a;--white:#f5f5f5;--muted:#8a8a8a;--gold:#ffd24a;--green:#67d98a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(900px 500px at 70% -10%,rgba(200,16,46,.18),transparent 60%),var(--black);color:var(--white);font-family:'Barlow Condensed',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:440px;background:linear-gradient(160deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:16px;padding:30px}
  .brand{font-family:'Oswald';font-weight:700;font-size:12px;letter-spacing:.4em;color:var(--red);text-transform:uppercase;margin-bottom:6px}
  h1{font-family:'Oswald';font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:24px}
  label{display:block;font-family:'Oswald';font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;margin-top:16px}
  input{width:100%;background:var(--black);border:1px solid var(--line);border-radius:8px;color:var(--white);padding:13px 14px;font-family:'Oswald';font-size:18px;font-weight:600}
  input:focus{outline:none;border-color:var(--red)}
  button{width:100%;background:var(--red);color:#fff;border:none;border-radius:8px;padding:14px;font-family:'Oswald';font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:15px;cursor:pointer;transition:.2s;margin-top:22px}
  button:hover{background:var(--red-glow);box-shadow:0 0 18px rgba(255,31,61,.5)}
  button:disabled{opacity:.5;cursor:wait}
  .msg{font-family:'Oswald';font-size:14px;letter-spacing:.05em;text-align:center;margin-top:16px;min-height:20px}
  .msg.ok{color:var(--green)}.msg.err{color:var(--red-glow)}
  .hidden{display:none}
  .preview{background:var(--black);border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:18px;font-family:'Oswald'}
  .preview .pl{font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
  .preview .pv{font-size:24px;font-weight:700;color:var(--gold)}
  .link{display:block;text-align:center;font-family:'Oswald';font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:18px;text-decoration:none}
  .link:hover{color:var(--white)}
  .resumo{display:flex;gap:8px;margin-top:18px}
  .rstat{flex:1;background:var(--black);border:1px solid var(--line);border-radius:8px;padding:11px 8px;text-align:center}
  .rstat .rl{font-family:'Oswald';font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .rstat .rv{font-family:'Oswald';font-weight:700;font-size:16px;margin-top:3px;color:var(--gold)}
</style>
</head>
<body>
<div class="box">
  <div class="brand">Body Evolution • Admin</div>
  <h1>Atualizar Placar</h1>

  <div id="loginView">
    <label>Senha de administrador</label>
    <input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Entrar</button>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <div id="adminView" class="hidden">
    <label>Dia do mês (1–31)</label>
    <input type="number" id="inDia" placeholder="ex: 2" min="1" max="31">
    <label>Venda DESTE dia (R$)</label>
    <input type="number" id="inVenda" placeholder="ex: 5227.10" step="0.01">
    <button id="saveBtn" onclick="salvar()">Lançar e Publicar</button>
    <div class="msg" id="saveMsg"></div>
    <div class="preview">
      <div class="pl">Acumulado do mês</div>
      <div class="pv" id="curVal">—</div>
      <div class="pl" style="margin-top:12px">Lançamentos por dia</div>
      <div id="listaDias" style="font-family:'Barlow Condensed';font-size:15px;color:var(--white);margin-top:6px;line-height:1.5">—</div>
    </div>

    <div class="pl" style="margin-top:22px;color:var(--gold)">Resumo do Diário</div>
    <div class="resumo">
      <div class="rstat"><div class="rl">Melhor dia</div><div class="rv" id="rMelhor">—</div></div>
      <div class="rstat"><div class="rl">Média/dia</div><div class="rv" id="rMedia">—</div></div>
      <div class="rstat"><div class="rl">Dias</div><div class="rv" id="rDias">—</div></div>
    </div>

    <a class="link" href="index.html" target="_blank">↗ Abrir placar das consultoras</a>
  </div>
</div>

<script src="config.js"></script>
<script>
const fmt=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
let vendas={}; // { "1": 5000, "2": 3200, ... }

function login(){
  const p=document.getElementById('pass').value;
  if(p===CONFIG.ADMIN_PASS){
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('adminView').classList.remove('hidden');
    carregarAtual();
  }else{
    document.getElementById('loginMsg').textContent='Senha incorreta';
  }
}

function somaAcc(){ return Object.values(vendas).reduce((a,b)=>a+(parseFloat(b)||0),0); }
function maxDia(){ const ks=Object.keys(vendas).map(Number); return ks.length?Math.max(...ks):0; }

function atualizarPreview(){
  document.getElementById('curVal').textContent=fmt(somaAcc());
  const dias=Object.keys(vendas).map(Number).sort((a,b)=>a-b);
  document.getElementById('listaDias').innerHTML = dias.length
    ? dias.map(d=>`Dia ${d}: ${fmt(vendas[d])}`).join('<br>')
    : '—';
  // resumo do diário
  const fmt0=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
  if(dias.length){
    const vals=dias.map(d=>parseFloat(vendas[d])||0);
    const melhor=Math.max(...vals);
    const media=vals.reduce((a,b)=>a+b,0)/dias.length;
    document.getElementById('rMelhor').textContent=fmt0(melhor);
    document.getElementById('rMedia').textContent=fmt0(media);
    document.getElementById('rDias').textContent=dias.length;
  }else{
    document.getElementById('rMelhor').textContent='—';
    document.getElementById('rMedia').textContent='—';
    document.getElementById('rDias').textContent='—';
  }
}

async function carregarAtual(){
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}/latest`,{
      headers:{'X-Master-Key':CONFIG.READ_KEY,'X-Bin-Meta':'false'}
    });
    const d=await r.json();
    // compatível com formato antigo (acc/dia) e novo (vendas)
    if(d.vendas && typeof d.vendas==='object'){
      vendas=d.vendas;
    }else if(d.acc){
      // migra o valor antigo para o dia que estava registrado
      vendas={}; if(d.dia) vendas[d.dia]=d.acc;
    }
    atualizarPreview();
  }catch(e){console.error(e);}
}

async function salvar(){
  const dia=parseInt(document.getElementById('inDia').value)||0;
  const venda=parseFloat(document.getElementById('inVenda').value);
  const btn=document.getElementById('saveBtn'),msg=document.getElementById('saveMsg');
  if(!dia || isNaN(venda)){
    msg.className='msg err';msg.textContent='Preencha o dia e o valor da venda.';return;
  }
  btn.disabled=true;msg.className='msg';msg.textContent='Publicando…';
  // grava/atualiza a venda do dia
  vendas[dia]=venda;
  const acc=somaAcc();
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':CONFIG.WRITE_KEY},
      body:JSON.stringify({vendas, acc, dia:maxDia(), ts:Date.now()})
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    msg.className='msg ok';msg.textContent='✔ Publicado! Acumulado: '+fmt(acc);
    atualizarPreview();
    document.getElementById('inVenda').value='';
  }catch(e){
    msg.className='msg err';msg.textContent='Erro ao publicar. Verifique a conexão.';
    delete vendas[dia]; // desfaz se falhou
    console.error(e);
  }finally{btn.disabled=false;}
}
</script>
</body>
</html>
